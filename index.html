<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardstack — Grading EV calculator</title>
    <meta name="description" content="Risk-adjusted expected value calculator for sports card grading decisions." />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4.75' y='1.75' width='14.5' height='20.5' rx='2.5' fill='none' stroke='%23a1a1aa' stroke-width='1.5'/%3E%3Crect x='7' y='4' width='10' height='4' rx='1' fill='%238b85ff'/%3E%3Crect x='7' y='9.5' width='10' height='10.25' rx='1' fill='%23a1a1aa' opacity='.45'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before first paint so there's no flash.
      try {
        var t = localStorage.getItem('theme') || 'dark';
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
